# SolrCloud — 1 ZooKeeper + 2 Solr nodes (HA). A shared host dir is mounted into
# both nodes so collection BACKUP/RESTORE has a common location.
name: solr-ha

services:
  zoo:
    image: zookeeper:3.9
    environment:
      ZOO_4LW_COMMANDS_WHITELIST: "mntr,conf,ruok"
    ports: ["2181:2181"]

  solr1:
    image: solr:9
    ports: ["8983:8983"]
    environment:
      ZK_HOST: "zoo:2181"
      SOLR_OPTS: "-Dsolr.allowPaths=/backup"
    depends_on: [zoo]
    command: ["solr-foreground"]
    volumes: ["data1:/var/solr", "backup:/backup"]

  solr2:
    image: solr:9
    ports: ["8984:8983"]
    environment:
      ZK_HOST: "zoo:2181"
      SOLR_OPTS: "-Dsolr.allowPaths=/backup"
    depends_on: [zoo]
    command: ["solr-foreground"]
    volumes: ["data2:/var/solr", "backup:/backup"]

volumes:
  data1:
  data2:
  backup:
