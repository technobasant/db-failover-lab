# ScyllaDB 2026.1 — 3-node cluster (HA). node1 is the seed; node2/3 join it.
# Each node is constrained to 1 shard / ~1.2G so all three fit one Docker host.
name: scylla-ha

services:
  scylla1:
    image: scylladb/scylla:2026.1
    command: ["--seeds=scylla1", "--smp=1", "--memory=1200M", "--overprovisioned=1", "--api-address=0.0.0.0"]
    ports: ["9042:9042"]
    volumes: ["s1:/var/lib/scylla"]

  scylla2:
    image: scylladb/scylla:2026.1
    command: ["--seeds=scylla1", "--smp=1", "--memory=1200M", "--overprovisioned=1", "--api-address=0.0.0.0"]
    volumes: ["s2:/var/lib/scylla"]
    depends_on: [scylla1]

  scylla3:
    image: scylladb/scylla:2026.1
    command: ["--seeds=scylla1", "--smp=1", "--memory=1200M", "--overprovisioned=1", "--api-address=0.0.0.0"]
    volumes: ["s3:/var/lib/scylla"]
    depends_on: [scylla1]

volumes:
  s1:
  s2:
  s3:
