# Minimal Prometheus config for the PoC lab.
# Add DB exporters (postgres_exporter, redis_exporter, mongodb_exporter, mysqld_exporter)
# as extra targets when you want to demo end-to-end metrics scraping.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Example (uncomment after adding exporter services to docker-compose):
  # - job_name: postgres
  #   static_configs:
  #     - targets: ["postgres_exporter:9187"]
  # - job_name: redis
  #   static_configs:
  #     - targets: ["redis_exporter:9121"]
