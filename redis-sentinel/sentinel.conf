# Sentinel template. Each sentinel copies this to a writable path at startup
# (sentinel rewrites its own config on failover, so it cannot be read-only in place).
port 26379
sentinel resolve-hostnames yes
sentinel announce-hostnames yes
# monitor the primary named "mymaster"; quorum 2 = 2 sentinels must agree it's down
sentinel monitor mymaster rprimary 6379 2
sentinel down-after-milliseconds mymaster 5000
sentinel failover-timeout mymaster 10000
sentinel parallel-syncs mymaster 1
