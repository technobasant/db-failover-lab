# Redis 8 Cluster — 6 nodes (becomes 3 primaries + 3 replicas, 16384 hash slots).
#
#   docker compose -f redis-cluster/docker-compose.yml up -d
#   # then form the cluster (uses container IPs, replicas=1 -> 3 masters/3 replicas):
#   IPS=$(for i in 1 2 3 4 5 6; do \
#     docker inspect -f '{{.NetworkSettings.Networks.redis-cluster_default.IPAddress}}:6379' \
#     redis-cluster-redis$i-1; done)
#   docker exec -it redis-cluster-redis1-1 sh -c "redis-cli --cluster create $IPS --cluster-replicas 1 --cluster-yes"
#
# Demonstrates: slot distribution, hash-tag co-location, CLUSTER keyslot, replica failover.
name: redis-cluster

x-node: &node
  image: redis:8
  command: >
    redis-server
    --port 6379
    --cluster-enabled yes
    --cluster-config-file nodes.conf
    --cluster-node-timeout 5000
    --appendonly yes
    --maxmemory 128mb
    --maxmemory-policy allkeys-lru

services:
  redis1: { <<: *node, ports: ["7101:6379"] }
  redis2: { <<: *node }
  redis3: { <<: *node }
  redis4: { <<: *node }
  redis5: { <<: *node }
  redis6: { <<: *node }
